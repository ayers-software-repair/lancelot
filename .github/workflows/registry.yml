name: registry

# Publishes server.json to the official MCP Registry with GitHub OIDC (no secret).
# Publishes the exact checked archive to npm through trusted publishing before registry metadata.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, for example v0.3.0'
        required: true

permissions:
  contents: read

concurrency:
  group: lancelot-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require the tag, main source and successful CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs source
      - run: npm ci
      - run: npm run build
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@^11.15.0
      - name: Inspect the archive and existing registry version
        id: pack
        run: |
          npm pack --json --ignore-scripts > "$RUNNER_TEMP/lancelot-pack.json"
          node scripts/release.mjs inspect "$RUNNER_TEMP/lancelot-pack.json"
      - name: Publish the inspected archive
        if: steps.pack.outputs.exists != 'true'
        env:
          ARCHIVE: ${{ steps.pack.outputs.archive }}
          CHANNEL: ${{ steps.source.outputs.channel }}
        run: npm publish "./$ARCHIVE" --access public --tag "$CHANNEL" --provenance
      - name: Verify public identity and archive integrity
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Checking npm publication ($attempt/6)"
            if node scripts/release.mjs published "$RUNNER_TEMP/lancelot-pack.json"; then exit 0; fi
            sleep 10
          done
          exit 1

  publish:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # Pinned as in the registry's GitHub Actions page; raise it deliberately.
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - name: Checkout at the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Tag matches server.json and package.json
        run: |
          set -euo pipefail
          version="${TAG#v}"
          sv="$(jq -r .version server.json)"
          pv="$(jq -r .version package.json)"
          spv="$(jq -r '.packages[0].version' server.json)"
          if [ "$version" != "$sv" ] || [ "$version" != "$pv" ] || [ "$version" != "$spv" ]; then
            echo "::error::tag $TAG, server.json $sv (package entry $spv), package.json $pv must all agree"
            exit 1
          fi

      - name: npm package is published and names this server
        run: |
          set -euo pipefail
          version="${TAG#v}"
          want="$(jq -r .name server.json)"
          if ! out="$(npm view "@ayerselectronics/lancelot@${version}" name mcpName --json)"; then
            echo "::error::@ayerselectronics/lancelot@${version} is not on npm yet. Run npm publish --access public first, then re-run this workflow."
            exit 1
          fi
          got="$(printf '%s' "$out" | jq -r .mcpName)"
          if [ "$got" != "$want" ]; then
            echo "::error::npm mcpName is '$got', server.json name is '$want'"
            exit 1
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish

      - name: Registry lists the exact server, package and remote
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Checking MCP Registry publication ($attempt/6)"
            if node scripts/release.mjs registry; then exit 0; fi
            sleep 10
          done
          exit 1

  dispatch:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      DISPATCH: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      # Keep package code and downloaded publisher tools away from App credentials.
      - name: Create company dispatch token
        if: ${{ env.DISPATCH == 'true' }}
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: '5549557'
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ayers-software-repair
          repositories: ayers.repair
          permission-contents: write
          skip-token-revoke: false

      - name: Dispatch the hosted release
        if: ${{ env.DISPATCH == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api repos/ayers-software-repair/ayers.repair/dispatches \
            -f event_type=mcp-release -f "client_payload[ref]=${TAG}"
          echo "dispatched mcp-release for ${TAG}"

      - name: Dispatch skipped
        if: ${{ env.DISPATCH != 'true' }}
        run: echo "RELEASE_APP_PRIVATE_KEY is not set; the hosted release was not dispatched"
