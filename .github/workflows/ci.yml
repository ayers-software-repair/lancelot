name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (lockfile)
        run: npm ci

      - name: Identity gate, tried on a bad tree and then run on this one
        run: |
          bash scripts/identity-gate.sh --self-test
          bash scripts/identity-gate.sh

      - name: Source headers
        run: node scripts/check-headers.mjs

      # typecheck, lint, test, build
      - name: Check
        run: npm run check

      - name: Registry metadata matches the package
        run: |
          node -e '
          const fs = require("node:fs");
          const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const s = JSON.parse(fs.readFileSync("server.json", "utf8"));
          const pkg = (s.packages || [])[0] || {};
          const bad = [];
          if (s.version !== p.version) bad.push("server.json version " + s.version + " != package.json " + p.version);
          if (pkg.identifier !== p.name) bad.push("package identifier " + pkg.identifier + " != name " + p.name);
          if (pkg.version !== p.version) bad.push("package version " + pkg.version + " != " + p.version);
          if (p.mcpName !== s.name) bad.push("mcpName " + p.mcpName + " != server.json name " + s.name);
          if (bad.length) { console.error(bad.join("\n")); process.exit(1); }
          '

      # The tarball lists dist, README.md, LICENSE and NOTICE (plus package.json), and no more.
      - name: Pack (dry run)
        run: npm pack --dry-run
